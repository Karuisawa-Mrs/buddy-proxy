// 管理接口的契约。protobuf 定义，Connect 传输。
//
// 这是前端与后端之间唯一的接缝：两侧都从这份文件生成代码，谁也不手写
// 对方的形状。改这个文件就是改接口，走 buf breaking 守演进。
//
// 鉴权不在 schema 里：它是 Authorization 头里的一个 Bearer 令牌，来源是
// /data/admin-token。/health 仍然是公开的，给外部调用。

syntax = "proto3";

package buddy.admin.v1;

// ── 公共形状 ──────────────────────────────────────────────────────────────

// 上游现在能不能接请求。
//
// 面板要的是这个，不是「开着没有」加上「登录了没有」自己拼 ——
// 后端知道的事情比面板多：额度用尽、正在登录、凭据快过期。
enum UpstreamState {
  UPSTREAM_STATE_UNSPECIFIED = 0;
  // 可以接。
  UPSTREAM_STATE_READY = 1;
  // 开关关着。
  UPSTREAM_STATE_DISABLED = 2;
  // 没登录。
  UPSTREAM_STATE_NO_CREDENTIAL = 3;
  // 登录过期了。
  UPSTREAM_STATE_CREDENTIAL_EXPIRED = 4;
  // 登录被拒了。
  UPSTREAM_STATE_CREDENTIAL_REJECTED = 5;
  // 上游的额度用完了。
  UPSTREAM_STATE_OUT_OF_CREDITS = 6;
  // 正在登录。
  UPSTREAM_STATE_LOGGING_IN = 7;
}

// 一个上游（MiniMax Code / Qoder 全球区 / Qoder 中国区 / WorkBuddy / TokenRhythm）。
// 一个 Provider：网关后面的一个账号。
message Upstream {
  string id = 1;
  // 给人看的名字。别名在面板上改，方便分辨同类的两个账号。
  string label = 2;
  // 它是哪一类上游（minimax、minimax-api、qoder……）。
  string kind = 11;
  // 它的别名。空就是没有设。
  string alias = 12;
  // 现在在生效的值。开关是热的：面板改完立刻生效，不用重启。
  bool enabled = 3;
  // 这个上游现在能不能接请求。面板照这个判断能不能选它。
  UpstreamState state = 10;
  // 这个上游现在公布了几个模型。
  int32 model_count = 5;
  // 凭据的状态摘要。
  CredentialStatus credential = 6;
  // 额度摘要：余额 / 积分 / 套餐额度，有哪个是哪个。
  UpstreamQuota quota = 7;
  // 上游的地址。
  string base_url = 8;
  // 区域：cn / global。
  string region = 9;
}

// 凭据的状态。
// 时间戳一律 Unix 毫秒。只有名字里带 _sec 的才是秒。
// 凭据的状态。
enum CredentialState {
  CREDENTIAL_STATE_UNSPECIFIED = 0;
  // 有凭据，没过期。
  CREDENTIAL_STATE_AUTHENTICATED = 1;
  // 没有凭据。
  CREDENTIAL_STATE_MISSING = 2;
  // 有凭据，但过期了。
  CREDENTIAL_STATE_EXPIRED = 3;
  // 拿到的凭据上游不认。
  CREDENTIAL_STATE_ERROR = 4;
  // 账号密码型上游：账号在，密码没存。
  CREDENTIAL_STATE_USABLE = 5;
  // 有凭据，但还没过期 —— 账号密码型上游的常态。
  CREDENTIAL_STATE_ANONYMOUS = 6;
}

message CredentialStatus {
  string kind = 1;
  CredentialState status = 2;
  // 只留前几位，不给全文。
  string fingerprint = 3;
  // Unix 毫秒。
  int64 expires_at = 4;
  // 秒。
  int64 remaining_sec = 5;
  bool warning = 6;
  string detail = 7;
  int32 generation = 8;
}

// 一个上游账号上的额度。
//
// 三样东西，各是各的，**不能相加**：
//
//   balance     余额（钱）。只有中转站这类平台才有。
//   credits     积分（点数）。Qoder、WorkBuddy、SenseNova 这类。
//   token_plan  套餐额度（按窗口的百分比）。MiniMax 的 coding plan。
//
// 后端把能拿到的都放上来，前端按有哪个显示哪个：有 token_plan 就显示
// token_plan，没有就显示积分，有余额就另外显示余额。
message UpstreamQuota {
  // 这个额度属于哪个上游。
  string upstream_id = 1;
  // 属于哪个账号。同一个上游可能有多个账号（TokenRhythm 每个租户一条）。
  string account_id = 2;
  // 余额（钱）。
  BalanceSummary balance = 3;
  // 积分（点数）。
  CreditSummary credits = 4;
  // 套餐额度（按窗口的百分比）。
  TokenPlan token_plan = 5;
}

// 余额：钱。同一平台的多个账号可以合并。
message BalanceSummary {
  double available_cny = 1;
  string currency = 2;
  // 每一笔赠金。
  repeated BalanceLot lots = 3;
  // 平台给的到期指针：最早到期的赠金是哪一批。
  // Unix 毫秒。
  int64 next_expiry_at = 4;
  double expiring_cny = 5;
}

// 余额里的一笔：赠金、充值本金。
message BalanceLot {
  string id = 1;
  string source_label = 2;
  double remaining_cny = 3;
  // Unix 毫秒。
  int64 expires_at = 4;
  // 平台用 2099-12-31 标记「永不过期」，这里原样透出。
  string status = 5;
}

// 积分：点数。跟余额不是一回事。
message CreditSummary {
  // 总额、已用、还剩。剩下的是权威的数，前两个由平台报。
  double total = 1;
  double used = 2;
  double remaining = 3;
  // 明细：套餐额度、加油包、每日签到……
  repeated CreditLot lots = 4;
  // 一句话说明，比如「每天 100 点，连签 3 天」。
  string note = 5;
}

// 积分里的一笔。
message CreditLot {
  string id = 1;
  string source_label = 2;
  double remaining = 3;
  // Unix 毫秒。
  int64 expires_at = 4;
  string status = 5;
}

// 套餐额度的一个窗口。
message TokenPlanWindow {
  // general / video。
  string label = 1;
  // 这个窗口里还剩多少个百分点。
  int32 interval_percent = 2;
  int32 weekly_percent = 3;
  // Unix 毫秒。
  int64 interval_ends_at = 4;
  int64 weekly_ends_at = 5;
}

// 套餐额度。
message TokenPlan {
  repeated TokenPlanWindow windows = 1;
}

// ── 系统 ──────────────────────────────────────────────────────────────────

message GetSystemStatusRequest {}

message GetSystemStatusResponse {
  string version = 1;
  repeated Upstream upstreams = 2;
  // 有改了还没生效的东西时为真。面板能改的那些是热的，改完就生效；
  // 服务内部的设置（在某个常量里）改了要重启。
  bool pending_restart = 3;
  int64 uptime_sec = 4;
  // 聚合路由现在公布了几个模型。
  int32 published_model_count = 5;
  // 面板自己的鉴权令牌是否已配置。
  bool admin_token_set = 6;
}

message RestartSystemRequest {}

message RestartSystemResponse {
  bool accepted = 1;
  string message = 2;
}

// ── 上游 ──────────────────────────────────────────────────────────────────

message ListUpstreamsRequest {}

message ListUpstreamsResponse {
  repeated Upstream upstreams = 1;
}

message SetUpstreamEnabledRequest {
  string upstream_id = 1;
  bool enabled = 2;
}

message SetUpstreamEnabledResponse {
  bool ok = 1;
  // 有改了还没生效的东西时为真。开关是热的，所以通常是假。
  bool pending_restart = 2;
  string message = 3;
}

// ── 配置 ──────────────────────────────────────────────────────────────────

message ListConfigRequest {}

message ConfigItem {
  string key = 1;
  // 给人看的名字：「MiniMax Code 上游」这种，不要把 env 的键名甩给人。
  string label = 2;
  string value = 3;
  // database / environment / default —— 这个值现在从哪来。
  string source = 4;
  // 这个键在代码里的默认值。不是上一个来源的值。
  string fallback = 5;
  // 归到面板的哪一组。
  string group = 6;
  string description = 7;
  // 这一项是不是敏感项。敏感项只写不读：value 不给真值。
  bool secret = 8;
  // 敏感项现在有没有值。留着空表示不改，别把掩码当值回传。
  // 敏感项的 value 是空串：只写不读，掩码长得像值。
  bool has_value = 9;
}

message ListConfigResponse {
  repeated ConfigItem items = 1;
  // 有改了还没生效的东西时为真。面板能改的那几个是热的。
  bool pending_restart = 2;
}

message SetConfigRequest {
  string key = 1;
  string value = 2;
  // 空字符串表示清掉这个覆盖，回到环境变量或默认值。
  bool clear = 3;
}

message SetConfigResponse {
  bool ok = 1;
  // 有改了还没生效的东西时为真。面板能改的那几个是热的，改完就生效。
  bool pending_restart = 2;
  string message = 3;
}

// ── 账号与凭据 ────────────────────────────────────────────────────────────

// 一个账号：上游的一个登录身份。
message Account {
  string id = 1;
  string upstream_id = 2;
  string label = 3;
  // usable / expired / missing
  string status = 4;
  int32 credential_count = 5;
  string detail = 6;
  // 这个账号的额度摘要。没有额度的账号不带这个。
  UpstreamQuota quota = 7;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

// 一条凭据：refresh token、API key、cookie 之类。
message Credential {
  string id = 1;
  string account_id = 2;
  string upstream_id = 3;
  // session / api_key / login / plan_key
  string kind = 4;
  string label = 5;
  // 掩码后的值：只留前几位。
  string masked = 6;
  string fingerprint = 7;
  // usable / expired / missing —— 与 Account.status 同一套词。
  string status = 8;
  int32 generation = 9;
  // Unix 毫秒。
  int64 expires_at = 10;
  int64 last_ok_at = 11;
  string last_error = 12;
  int64 updated_at = 13;
}

message ListCredentialsRequest {
  // 空串表示全部账号的凭据。
  string account_id = 1;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

message TestCredentialRequest {
  string credential_id = 1;
}

message TestCredentialResponse {
  bool ok = 1;
  string message = 2;
  // Unix 毫秒。
  int64 checked_at = 3;
}

message RefreshCredentialRequest {
  string credential_id = 1;
}

message RefreshCredentialResponse {
  bool ok = 1;
  string message = 2;
  int32 generation = 3;
}

// 写一个 Provider 的 API Key 列表。空的 key 会被丢掉。
message SetProviderKeysRequest {
  // 目前只有 minimax-api 需要。
  string upstream_id = 1;
  // 按顺序排：第一把 key 是第一个租户。
  repeated string keys = 2;
}

message SetProviderKeysResponse {
  bool ok = 1;
  string message = 2;
  int32 count = 3;
}

// ── Provider ───────────────────────────────────────────────────────────────

message ListProviderKindsRequest {}

// 加一个 Provider。同一类可以加很多个，它们各有各的凭据。
message AddProviderRequest {
  // 路径里就是它，所以要自己起一个好认的。
  string id = 1;
  // 它是哪一类上游。
  string kind = 2;
  // 别名：面板上显示在名字后面。
  string alias = 3;
  // 区域（qoder 有全球区与中国区之分）。
  string region = 4;
}

message AddProviderResponse {
  bool ok = 1;
  string message = 2;
}

// 改一个 Provider 的别名与开关。
message UpdateProviderRequest {
  string id = 1;
  // 空字符串表示不改。
  string alias = 2;
  // 没说就是不改。
  optional bool enabled = 3;
}

message UpdateProviderResponse {
  bool ok = 1;
  string message = 2;
}

// 删一个 Provider。
message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {
  bool ok = 1;
  string message = 2;
}

// 面板上能选的一种类型。
message ProviderKind {
  string kind = 1;
  string label = 2;
  // device / browser / password / code —— 面板照这个画登录的表单。
  string login = 3;
  // 这个类要区域吗。
  bool needs_region = 4;
  // 有区域的话，都有哪些。
  repeated string regions = 5;
}

// 面板上能选的类型。面板不问后端有哪些类，它问。
message ListProviderKindsResponse {
  repeated ProviderKind kinds = 1;
}

// ── 余额 ──────────────────────────────────────────────────────────────────

message GetBalanceRequest {
  string upstream_id = 1;
}

message GetBalanceResponse {
  // 每个账号一条。TokenRhythm 一个租户一条，别的上游一条。
  repeated UpstreamQuota quotas = 1;
}

// ── 用量 ──────────────────────────────────────────────────────────────────

message UsageSummary {
  int64 requests = 1;
  int64 succeeded = 2;
  int64 failed = 3;
  int64 prompt_tokens = 4;
  int64 completion_tokens = 5;
  int64 reasoning_tokens = 6;
  int64 latency_ms_sum = 7;
}

message GetUsageSummaryRequest {
  // 空表示全部。
  string upstream_id = 1;
  // 时间窗。空 = 全部。hour / day / week / month，或 30d、12h 这样的写法。
  string window = 2;
}

message GetUsageSummaryResponse {
  UsageSummary total = 1;
  // 按上游分组。
  repeated UsageBucket by_upstream = 2;
  // 按模型分组。
  repeated UsageBucket by_model = 3;
  // 按天分组的时间序列。
  repeated UsageBucket by_day = 4;
  // 按发请求的 agent 分组：pi、opencode、dsh……
  repeated UsageBucket by_agent = 5;
  // 按会话分组。会话 id 从请求头认出来，认不出来的算「未知」。
  repeated UsageBucket by_session = 6;
  // 按父会话分组。空的是主代理，别的键是子代理的父会话。
  repeated UsageBucket by_parent_session = 7;
}

message UsageBucket {
  string key = 1;
  UsageSummary summary = 2;
}

message ListUsageEventsRequest {
  int32 limit = 1;
  string upstream_id = 2;
  string model = 3;
  // 游标：只返回 id 比它小的。0 表示从头。
  int64 before_id = 4;
  // 时间窗，跟 GetUsageSummaryRequest 一样：空 = 全部，today = 本地零点起。
  string window = 5;
}

message UsageEvent {
  // 按时间排出来的序号，只在这一批数据里有效，不是持久 id。
  int64 id = 1;
  // Unix 毫秒。
  int64 ts = 2;
  string upstream_id = 3;
  string model = 4;
  // agent 写的模型 id。
  string agent_model = 5;
  // 谁发来的请求，从请求头认出来的：pi、opencode、dsh……
  string agent = 6;
  // 这次请求模拟的是哪个桌面客户端。
  string client = 7;
  int64 prompt_tokens = 8;
  int64 completion_tokens = 9;
  int64 reasoning_tokens = 10;
  int64 latency_ms = 11;
  string status = 12;
  string error = 13;
  // 这次请求属于哪个会话。认不出来就是空的。
  string session_id = 14;
  // 父会话。只有子代理有；空的是主代理。
  string parent_session_id = 15;
}

message ListUsageEventsResponse {
  repeated UsageEvent events = 1;
}

// ── 公布的模型（聚合路由） ────────────────────────────────────────────────

// 模型在库里，根路由却不公布它的原因。
enum UnpublishedReason {
  UNPUBLISHED_REASON_UNSPECIFIED = 0;
  // 模型自己被停用了。
  UNPUBLISHED_REASON_DISABLED = 1;
  // 目标的上游关着。
  UNPUBLISHED_REASON_UPSTREAM_DISABLED = 2;
  // 目标的上游没登录。
  UNPUBLISHED_REASON_NO_CREDENTIAL = 3;
  // 目标的上游不列这个模型了。
  UNPUBLISHED_REASON_MODEL_GONE = 4;
  // 目标自己被停用了。
  UNPUBLISHED_REASON_TARGET_DISABLED = 5;
  // 一个能用的目标都没有。
  UNPUBLISHED_REASON_NO_TARGET = 6;
}

// 一个公布出来的模型：对外的 id 背后有哪几个上游模型。
message PublishedModel {
  string id = 1;
  string display_name = 2;
  bool enabled = 3;
  // 根路由现在真的公布它吗？上游全关着的时候，模型在库里但没人能接。
  bool published = 4;
  // 没公布的原因。公布了就是 UNSPECIFIED。
  optional UnpublishedReason unpublished_reason = 13;
  // single / fallback
  string strategy = 5;
  // 不给表示继承目标的值。给了就用这个值。
  optional int32 context_window = 6;
  optional int32 max_output_tokens = 7;
  optional bool reasoning = 8;
  optional bool tool_call = 9;
  // 空表示继承目标支持的档位。
  repeated string effort_options = 10;
  repeated PublishedTarget targets = 11;
  int64 updated_at = 12;
}

message PublishedTarget {
  // qoder / qoder-cn / workbuddy-cn / minimax / tokenrhythm
  string group_name = 1;
  string upstream_model = 2;
  // 权重。越大越优先：先试权重大的，失败才试小的。
  int32 weight = 3;
  bool enabled = 4;
  // 这个目标分到了多少请求。只读：保存时会被网关自己的计数覆盖。
  int64 requests = 5;
  int64 failed = 6;
}

message ListPublishedModelsRequest {}

message ListPublishedModelsResponse {
  repeated PublishedModel models = 1;
}

message SavePublishedModelRequest {
  // model.id 为空表示新建，非空表示改那一条。
  PublishedModel model = 1;
}

message SavePublishedModelResponse {
  bool ok = 1;
  string id = 2;
  string message = 3;
}

message DeletePublishedModelRequest {
  string id = 1;
}

message DeletePublishedModelResponse {
  bool ok = 1;
  string message = 2;
}

// ── 每日权益 ──────────────────────────────────────────────────────────────

message GetBenefitStatusRequest {}

message BenefitStatus {
  string upstream_id = 1;
  // 今日已签到 / 活动已领 / 暂无新活动
  string summary = 2;
  repeated string lines = 3;
  int64 checked_at = 4;
  int32 credits = 5;
  bool ok = 6;
}

message GetBenefitStatusResponse {
  repeated BenefitStatus benefits = 1;
}

message RunBenefitNowRequest {}

message RunBenefitNowResponse {
  bool ok = 1;
  repeated string lines = 2;
}

// ── 目录与日志 ────────────────────────────────────────────────────────────

message ListModelsRequest {
  string upstream_id = 1;
}

message CatalogModel {
  string id = 1;
  string display_name = 2;
  int32 context_window = 3;
  int32 max_output_tokens = 4;
  bool reasoning = 5;
  bool tool_call = 6;
  repeated string effort_options = 7;
  // 计费倍率，0 是免费。
  double credits = 8;
}

message ListModelsResponse {
  repeated CatalogModel models = 1;
}

message TailLogRequest {
  int32 lines = 1;
  // 检索词。
  string filter = 2;
}

message TailLogResponse {
  repeated string lines = 1;
}

// ── 登录授权 ───────────────────────────────────────────────────────────────

// 一次登录会话。面板靠它画对话框、显示倒计时。
message LoginSession {
  // 本地的一次登录 id。
  string login_id = 1;
  string upstream_id = 2;
  // 账号的槽位。空 = 这个上游的默认账号。
  string account_id = 3;
  // pending / approved / failed / expired / cancelled
  string status = 4;
  // 面板按它决定画什么：device / browser / password / code / token。
  string method = 5;
  // 用户要点的那个地址。
  string authorization_url = 6;
  // 设备流的大字码。MiniMax 有；Qoder、WorkBuddy 没有。
  string user_code = 7;
  // 过期时刻。Unix 毫秒。
  int64 expires_at = 8;
  // 给人看的一句话。
  string message = 9;
  // 登录成功后这条凭据的状态摘要。
  CredentialStatus credential = 10;
  // 账号密码型上游的账号名。
  string username = 11;
}

message BeginLoginRequest {
  // minimax / qoder / qoder-cn / workbuddy-cn / tokenrhythm / sensenova / intern-ai
  string upstream_id = 1;
  string account_id = 2;
  // 3 曾是 intern-ai 的子站选择。intern-ai 的两个子站现在共用一个 token，
  // 登录不再问子站。
  reserved 3;
}

message BeginLoginResponse {
  LoginSession session = 1;
  bool ok = 2;
  string message = 3;
}

message GetLoginStatusRequest {
  string login_id = 1;
}

message GetLoginStatusResponse {
  LoginSession session = 1;
  bool ok = 2;
  string message = 3;
}

message CancelLoginRequest {
  string login_id = 1;
}

message CancelLoginResponse {
  bool ok = 1;
  string message = 2;
}

message LoginWithPasswordRequest {
  string upstream_id = 1;
  string account_id = 2;
  string username = 3;
  // 密码。只在这一次请求里出现，不回显、不进日志。
  string password = 4;
  // intern-ai：人机校验的三个值（浏览器里过一次阿里云验证码后拿到）。
  string captcha_verify_param = 5;
  string captcha_scene_id = 6;
  string captcha_prefix = 7;
  // 记住密码吗？true = 存进 secrets。
  bool remember = 8;
}

message LoginWithPasswordResponse {
  bool ok = 1;
  string message = 2;
  Account account = 3;
  Credential credential = 4;
}

message ExchangeLoginCodeRequest {
  string upstream_id = 1;
  string account_id = 2;
  // 浏览器里拿到的 code。
  string code = 3;
  // 4 曾是 intern-ai 的子站选择，现在没有了。
  reserved 4;
}

message ExchangeLoginCodeResponse {
  bool ok = 1;
  string message = 2;
  Credential credential = 3;
}

message ImportLoginTokenRequest {
  string upstream_id = 1;
  string account_id = 2;
  // intern-ai 的 uaa-token。
  string token = 3;
  // 4 曾是 intern-ai 的子站选择，现在没有了。
  reserved 4;
}

message ImportLoginTokenResponse {
  bool ok = 1;
  string message = 2;
  Credential credential = 3;
}

