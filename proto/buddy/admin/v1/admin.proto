// 管理接口的契约。protobuf 定义，Connect 传输。
//
// 这是前端与后端之间唯一的接缝：两侧都从这份文件生成代码，谁也不手写
// 对方的形状。改这个文件就是改接口，走 buf breaking 守演进。
//
// 鉴权不在 schema 里：它是 Authorization 头里的一个 Bearer 令牌，来源是
// /data/admin-token。/health 仍然是公开的，给外部调用。

syntax = "proto3";

package buddy.admin.v1;

// ── 公共形状 ──────────────────────────────────────────────────────────────

// 一个上游（MiniMax Code / Qoder 全球区 / Qoder 中国区 / WorkBuddy / TokenRhythm）。
message Upstream {
  string id = 1;
  // 给人看的名字。
  string label = 2;
  // 将要生效的值：面板改了但还没重启时，这里已经是改后的值。
  bool enabled = 3;
  // 改过、还没重启。
  bool pending = 4;
  // 这个上游现在公布了几个模型。
  int32 model_count = 5;
  // 凭据的状态摘要。
  CredentialStatus credential = 6;
  // 余额的摘要，没有余额的上游不带这个。
  BalanceSummary balance = 7;
  // 上游的地址。
  string base_url = 8;
  // 区域：cn / global。
  string region = 9;
}

// 凭据的状态。
// 时间戳一律 Unix 毫秒。只有名字里带 _sec 的才是秒。
message CredentialStatus {
  string kind = 1;
  // authenticated / missing / expired / error
  string status = 2;
  // 只留前几位，不给全文。
  string fingerprint = 3;
  // Unix 毫秒。
  int64 expires_at = 4;
  // 秒。
  int64 remaining_sec = 5;
  bool warning = 6;
  string detail = 7;
  int32 generation = 8;
}

// 余额。
message BalanceSummary {
  // 这个余额属于哪个上游。
  string upstream_id = 1;
  // 属于哪个账号。同一个上游可能有多个账号（TokenRhythm 每个租户一条）。
  string account_id = 2;
  double available_cny = 3;
  string currency = 4;
  // 每一笔赠金。
  repeated CreditLot lots = 5;
  // 平台给的到期指针：最早到期的赠金是哪一批。
  // Unix 毫秒。
  int64 next_expiry_at = 6;
  double expiring_cny = 7;
  // 套餐额度：几个窗口，每个窗口剩多少。没有套餐的账号不带这个。
  TokenPlan token_plan = 8;
}

// 套餐额度的一个窗口。
message TokenPlanWindow {
  // general / video。
  string label = 1;
  // 这个窗口里还剩多少个百分点。
  int32 interval_percent = 2;
  int32 weekly_percent = 3;
  // Unix 毫秒。
  int64 interval_ends_at = 4;
  int64 weekly_ends_at = 5;
}

// 套餐额度。
message TokenPlan {
  repeated TokenPlanWindow windows = 1;
}

// 一笔赠金。
message CreditLot {
  string id = 1;
  string source_label = 2;
  double remaining_cny = 3;
  int64 expires_at = 4;
  // 平台用 2099-12-31 标记「永不过期」，这里原样透出。
  string status = 5;
}

// ── 系统 ──────────────────────────────────────────────────────────────────

message GetSystemStatusRequest {}

message GetSystemStatusResponse {
  string version = 1;
  repeated Upstream upstreams = 2;
  // 配置改了但还没重启生效时为真。
  bool pending_restart = 3;
  int64 uptime_sec = 4;
  // 聚合路由现在公布了几个模型。
  int32 published_model_count = 5;
  // 面板自己的鉴权令牌是否已配置。
  bool admin_token_set = 6;
}

message RestartSystemRequest {}

message RestartSystemResponse {
  bool accepted = 1;
  string message = 2;
}

// ── 上游 ──────────────────────────────────────────────────────────────────

message ListUpstreamsRequest {}

message ListUpstreamsResponse {
  repeated Upstream upstreams = 1;
}

message SetUpstreamEnabledRequest {
  string upstream_id = 1;
  bool enabled = 2;
}

message SetUpstreamEnabledResponse {
  bool ok = 1;
  // 改了要重启才生效。
  bool pending_restart = 2;
  string message = 3;
}

// ── 配置 ──────────────────────────────────────────────────────────────────

message ListConfigRequest {}

message ConfigItem {
  string key = 1;
  // 给人看的名字：「MiniMax Code 上游」这种，不要把 env 的键名甩给人。
  string label = 2;
  string value = 3;
  // database / environment / default —— 这个值现在从哪来。
  string source = 4;
  // 这个键在代码里的默认值。不是上一个来源的值。
  string fallback = 5;
  // 归到面板的哪一组。
  string group = 6;
  string description = 7;
  // 这一项是不是敏感项。敏感项只写不读：value 不给真值。
  bool secret = 8;
  // 敏感项现在有没有值。留着空表示不改，别把掩码当值回传。
  // 敏感项的 value 是空串：只写不读，掩码长得像值。
  bool has_value = 9;
}

message ListConfigResponse {
  repeated ConfigItem items = 1;
  bool pending_restart = 2;
}

message SetConfigRequest {
  string key = 1;
  string value = 2;
  // 空字符串表示清掉这个覆盖，回到环境变量或默认值。
  bool clear = 3;
}

message SetConfigResponse {
  bool ok = 1;
  bool pending_restart = 2;
  string message = 3;
}

// ── 账号与凭据 ────────────────────────────────────────────────────────────

// 一个账号：上游的一个登录身份。
message Account {
  string id = 1;
  string upstream_id = 2;
  string label = 3;
  // usable / expired / missing
  string status = 4;
  int32 credential_count = 5;
  string detail = 6;
  // 这个账号的余额摘要。没有余额的账号不带这个。
  BalanceSummary balance = 7;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

// 一条凭据：refresh token、API key、cookie 之类。
message Credential {
  string id = 1;
  string account_id = 2;
  string upstream_id = 3;
  // session / api_key / login / plan_key
  string kind = 4;
  string label = 5;
  // 掩码后的值：只留前几位。
  string masked = 6;
  string fingerprint = 7;
  // usable / expired / missing —— 与 Account.status 同一套词。
  string status = 8;
  int32 generation = 9;
  // Unix 毫秒。
  int64 expires_at = 10;
  int64 last_ok_at = 11;
  string last_error = 12;
  int64 updated_at = 13;
}

message ListCredentialsRequest {
  // 空串表示全部账号的凭据。
  string account_id = 1;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

message TestCredentialRequest {
  string credential_id = 1;
}

message TestCredentialResponse {
  bool ok = 1;
  string message = 2;
  // Unix 毫秒。
  int64 checked_at = 3;
}

message RefreshCredentialRequest {
  string credential_id = 1;
}

message RefreshCredentialResponse {
  bool ok = 1;
  string message = 2;
  int32 generation = 3;
}

// ── 余额 ──────────────────────────────────────────────────────────────────

message GetBalanceRequest {
  string upstream_id = 1;
}

message GetBalanceResponse {
  repeated BalanceSummary balances = 1;
}

// ── 用量 ──────────────────────────────────────────────────────────────────

message UsageSummary {
  int64 requests = 1;
  int64 succeeded = 2;
  int64 failed = 3;
  int64 prompt_tokens = 4;
  int64 completion_tokens = 5;
  int64 reasoning_tokens = 6;
  int64 latency_ms_sum = 7;
}

message GetUsageSummaryRequest {
  // 空表示全部。
  string upstream_id = 1;
  // 时间窗。空 = 全部。hour / day / week / month，或 30d、12h 这样的写法。
  string window = 2;
}

message GetUsageSummaryResponse {
  UsageSummary total = 1;
  // 按上游分组。
  repeated UsageBucket by_upstream = 2;
  // 按模型分组。
  repeated UsageBucket by_model = 3;
  // 按天分组的时间序列。
  repeated UsageBucket by_day = 4;
}

message UsageBucket {
  string key = 1;
  UsageSummary summary = 2;
}

message ListUsageEventsRequest {
  int32 limit = 1;
  string upstream_id = 2;
  string model = 3;
  // 游标：只返回 id 比它小的。0 表示从头。
  int64 before_id = 4;
}

message UsageEvent {
  // 按时间排出来的序号，只在这一批数据里有效，不是持久 id。
  int64 id = 1;
  // Unix 毫秒。
  int64 ts = 2;
  string upstream_id = 3;
  string model = 4;
  // agent 写的模型 id。
  string agent_model = 5;
  string dialect = 6;
  // 这次请求模拟的是哪个桌面客户端。
  string client = 7;
  int64 prompt_tokens = 8;
  int64 completion_tokens = 9;
  int64 reasoning_tokens = 10;
  int64 latency_ms = 11;
  string status = 12;
  string error = 13;
}

message ListUsageEventsResponse {
  repeated UsageEvent events = 1;
}

// ── 公布的模型（聚合路由） ────────────────────────────────────────────────

// 一个公布出来的模型：对外的 id 背后有哪几个上游模型。
message PublishedModel {
  string id = 1;
  string display_name = 2;
  bool enabled = 3;
  // single / fallback
  string strategy = 4;
  // 不给表示继承目标的值。给了就用这个值。
  optional int32 context_window = 5;
  optional int32 max_output_tokens = 6;
  optional bool reasoning = 7;
  optional bool tool_call = 8;
  // 空表示继承目标支持的档位。
  repeated string effort_options = 9;
  repeated PublishedTarget targets = 10;
  int64 updated_at = 11;
}

message PublishedTarget {
  // qoder / qoder-cn / workbuddy-cn / minimax / tokenrhythm
  string group_name = 1;
  string upstream_model = 2;
  // 权重。越大越优先：先试权重大的，失败才试小的。
  int32 weight = 3;
  bool enabled = 4;
  // 这个目标分到了多少请求。只读：保存时会被网关自己的计数覆盖。
  int64 requests = 5;
  int64 failed = 6;
}

message ListPublishedModelsRequest {}

message ListPublishedModelsResponse {
  repeated PublishedModel models = 1;
}

message SavePublishedModelRequest {
  // model.id 为空表示新建，非空表示改那一条。
  PublishedModel model = 1;
}

message SavePublishedModelResponse {
  bool ok = 1;
  string id = 2;
  string message = 3;
}

message DeletePublishedModelRequest {
  string id = 1;
}

message DeletePublishedModelResponse {
  bool ok = 1;
  string message = 2;
}

// ── 每日权益 ──────────────────────────────────────────────────────────────

message GetBenefitStatusRequest {}

message BenefitStatus {
  string upstream_id = 1;
  // 今日已签到 / 活动已领 / 暂无新活动
  string summary = 2;
  repeated string lines = 3;
  int64 checked_at = 4;
  int32 credits = 5;
  bool ok = 6;
}

message GetBenefitStatusResponse {
  repeated BenefitStatus benefits = 1;
}

message RunBenefitNowRequest {}

message RunBenefitNowResponse {
  bool ok = 1;
  repeated string lines = 2;
}

// ── 目录与日志 ────────────────────────────────────────────────────────────

message ListModelsRequest {
  string upstream_id = 1;
}

message CatalogModel {
  string id = 1;
  string display_name = 2;
  int32 context_window = 3;
  int32 max_output_tokens = 4;
  bool reasoning = 5;
  bool tool_call = 6;
  repeated string effort_options = 7;
  // 计费倍率，0 是免费。
  double credits = 8;
}

message ListModelsResponse {
  repeated CatalogModel models = 1;
}

message TailLogRequest {
  int32 lines = 1;
  // 检索词。
  string filter = 2;
}

message TailLogResponse {
  repeated string lines = 1;
}

// ── 登录授权 ───────────────────────────────────────────────────────────────

// 一次登录会话。面板靠它画对话框、显示倒计时。
message LoginSession {
  // 本地的一次登录 id。
  string login_id = 1;
  string upstream_id = 2;
  // 账号的槽位。空 = 这个上游的默认账号。
  string account_id = 3;
  // pending / approved / failed / expired / cancelled
  string status = 4;
  // 面板按它决定画什么：device / browser / password / code / token。
  string method = 5;
  // 用户要点的那个地址。
  string authorization_url = 6;
  // 设备流的大字码。MiniMax 有；Qoder、WorkBuddy 没有。
  string user_code = 7;
  // 过期时刻。Unix 毫秒。
  int64 expires_at = 8;
  // 给人看的一句话。
  string message = 9;
  // 登录成功后这条凭据的状态摘要。
  CredentialStatus credential = 10;
  // 账号密码型上游的账号名。
  string username = 11;
}

message BeginLoginRequest {
  // minimax / qoder / qoder-cn / workbuddy-cn / tokenrhythm / sensenova / intern-ai
  string upstream_id = 1;
  string account_id = 2;
  // intern-ai：登哪个子站。discovery / chat。空 = 两个都要。
  string site = 3;
}

message BeginLoginResponse {
  LoginSession session = 1;
  bool ok = 2;
  string message = 3;
}

message GetLoginStatusRequest {
  string login_id = 1;
}

message GetLoginStatusResponse {
  LoginSession session = 1;
  bool ok = 2;
  string message = 3;
}

message CancelLoginRequest {
  string login_id = 1;
}

message CancelLoginResponse {
  bool ok = 1;
  string message = 2;
}

message LoginWithPasswordRequest {
  string upstream_id = 1;
  string account_id = 2;
  string username = 3;
  // 密码。只在这一次请求里出现，不回显、不进日志。
  string password = 4;
  // intern-ai：人机校验的三个值（浏览器里过一次阿里云验证码后拿到）。
  string captcha_verify_param = 5;
  string captcha_scene_id = 6;
  string captcha_prefix = 7;
  // 记住密码吗？true = 存进 secrets。
  bool remember = 8;
}

message LoginWithPasswordResponse {
  bool ok = 1;
  string message = 2;
  Account account = 3;
  Credential credential = 4;
}

message ExchangeLoginCodeRequest {
  string upstream_id = 1;
  string account_id = 2;
  // 浏览器里拿到的 code。
  string code = 3;
  // intern-ai：code 是给哪个子站签的。
  string site = 4;
}

message ExchangeLoginCodeResponse {
  bool ok = 1;
  string message = 2;
  Credential credential = 3;
}

message ImportLoginTokenRequest {
  string upstream_id = 1;
  string account_id = 2;
  // intern-ai 的 uaa-token。
  string token = 3;
  string site = 4;
}

message ImportLoginTokenResponse {
  bool ok = 1;
  string message = 2;
  Credential credential = 3;
}

// ── 服务 ──────────────────────────────────────────────────────────────────

service AdminService {
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);
  rpc RestartSystem(RestartSystemRequest) returns (RestartSystemResponse);

  rpc ListUpstreams(ListUpstreamsRequest) returns (ListUpstreamsResponse);
  rpc SetUpstreamEnabled(SetUpstreamEnabledRequest) returns (SetUpstreamEnabledResponse);

  rpc ListConfig(ListConfigRequest) returns (ListConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc TestCredential(TestCredentialRequest) returns (TestCredentialResponse);
  rpc RefreshCredential(RefreshCredentialRequest) returns (RefreshCredentialResponse);

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
  rpc ListUsageEvents(ListUsageEventsRequest) returns (ListUsageEventsResponse);

  rpc ListPublishedModels(ListPublishedModelsRequest) returns (ListPublishedModelsResponse);
  rpc SavePublishedModel(SavePublishedModelRequest) returns (SavePublishedModelResponse);
  rpc DeletePublishedModel(DeletePublishedModelRequest) returns (DeletePublishedModelResponse);

  rpc GetBenefitStatus(GetBenefitStatusRequest) returns (GetBenefitStatusResponse);
  rpc RunBenefitNow(RunBenefitNowRequest) returns (RunBenefitNowResponse);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc TailLog(TailLogRequest) returns (TailLogResponse);

  rpc BeginLogin(BeginLoginRequest) returns (BeginLoginResponse);
  rpc GetLoginStatus(GetLoginStatusRequest) returns (GetLoginStatusResponse);
  rpc CancelLogin(CancelLoginRequest) returns (CancelLoginResponse);
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (LoginWithPasswordResponse);
  rpc ExchangeLoginCode(ExchangeLoginCodeRequest) returns (ExchangeLoginCodeResponse);
  rpc ImportLoginToken(ImportLoginTokenRequest) returns (ImportLoginTokenResponse);
}
