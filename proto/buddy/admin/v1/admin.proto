  rpc RefreshCredential(RefreshCredentialRequest) returns (RefreshCredentialResponse);
  rpc SetProviderKeys(SetProviderKeysRequest) returns (SetProviderKeysResponse);
  rpc AddProvider(AddProviderRequest) returns (AddProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  rpc ListProviderKinds(ListProviderKindsRequest) returns (ListProviderKindsResponse);

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
  rpc ListUsageEvents(ListUsageEventsRequest) returns (ListUsageEventsResponse);

  rpc ListPublishedModels(ListPublishedModelsRequest) returns (ListPublishedModelsResponse);
