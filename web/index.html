<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 面板里存着全权的令牌，别让别的站点从 referer 里拿到地址。 -->
    <meta name="referrer" content="no-referrer" />
    <title>Buddy Proxy 管理面板</title>
    <meta name="description" content="网关的管理面板：上游、凭据、余额、用量、公布的模型。" />
    <script>
      // 主题：先把 class 摆好，页面不会闪一下白。跟 components/theme-provider.tsx
      // 是同一套逻辑（这里跑在 React 之前）。
      try {
        var t = localStorage.getItem('buddy.admin.theme') || 'system'
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
