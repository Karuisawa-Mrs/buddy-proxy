# 工具版本统一在这里。运行时只用 mise 装的这一份。
[tools]
node = "lts"
pnpm = "latest"
# The contract compiler. The generated TypeScript client is committed, so a
# normal build never needs it — only a change to the contract does.
buf = "1.74.0"

# 运行的每一个 node 都带着这个。
#
# 契约生成的代码里有 enum（protobuf 的枚举），而 Node 的「只剥类型」不认
# enum —— 它要把 enum 编译成对象，不是剥掉就算。transform-types 走的是编译
# 那条路，所以 enum 能跑。
#
# 放在这里，mise 起的每一个任务都带着它（跑测试、起服务、起面板）。
[env]
NODE_OPTIONS = "--experimental-transform-types --disable-warning=ExperimentalWarning"

# ── 后端 ──────────────────────────────────────────────────────────────────

[tasks.serve]
description = "Run the router (every upstream, OpenAI/Anthropic compatible)"
run = "node router-proxy.ts"

[tasks.typecheck]
description = "Type-check the router"
# pnpm exec：node_modules/.bin 不在 mise 任务的 PATH 里，直接调 tsc 会找不到。
run = "pnpm exec tsc --noEmit"

[tasks."lint:size"]
description = "Name the source files that grew past 400 lines (a warning; --strict makes it fail)"
run = "node --experimental-strip-types check-file-size.ts"

[tasks.test]
description = "Run the offline tests (the mock upstream, no tokens spent)"
run = "bash test/smoke.sh"
depends = ["test:selection", "test:policy", "test:upstream:status", "test:minimax:api:policy", "test:minimax:fallback", "test:minimax:credits", "test:minimax:credits:view", "test:policy:e2e", "test:catalog-parity", "test:cleanup", "test:cleanup:admin", "test:quota", "test:dead-session", "test:periodic", "test:periodic:off", "test:workbuddy:benefits", "test:workbuddy:catalog", "test:refresh-flow", "test:zcode:headers", "test:zcode:session", "test:session-map", "test:balance-account", "test:timer-refresh", "test:account-weight", "test:token-plan", "test:model-visibility", "test:cooldown", "test:route", "test:health:cooldown", "test:aggregate:error", "test:aggregate:usage", "test:admin:contract", "test:admin:login", "test:login:record", "test:catalog:persist", "test:upstream:cooldown", "test:admin:regression", "test:deliver:frames", "test:peek:stream", "test:dialect:stream", "test:admin:policy", "test:sensenova:intern", "test:intern-ai:quota"]

[tasks."test:selection"]
description = "Check the shared selection package (the order, the fallback, the stop)"
run = "node --experimental-strip-types test/selection-check.ts"

[tasks."test:policy"]
description = "Check the upstream policies (the accounts, the order, the failure kinds)"
run = "node --experimental-strip-types test/policy-check.ts"

[tasks."test:upstream:status"]
description = "Check that the transports keep the upstream's own status (a fake upstream)"
run = "node --experimental-strip-types test/upstream-status-check.ts"

[tasks."test:upstream:cooldown"]
description = "Check that the panel sees the cooldown (the state, the deadline, the reason)"
run = "node --experimental-strip-types test/upstream-cooldown-check.ts"

[tasks."test:minimax:api:policy"]
description = "Check the open platform's policy (one key, the switch, the business code)"
run = "node --experimental-strip-types test/minimax-api-policy-check.ts"

[tasks."test:policy:e2e"]
description = "Check that the policy takes effect at once (a fake upstream, no tokens spent)"
run = "node --experimental-strip-types test/provider-policy-e2e-check.ts"

[tasks."test:minimax:fallback"]
description = "Check that a rejected MiniMax account is left for the next one"
run = "node --experimental-strip-types test/minimax-fallback-check.ts"

[tasks."test:minimax:credits"]
description = "Check the MiniMax availability: the plan windows, or the points plus the auto-spend switch"
run = "node --experimental-strip-types test/minimax-credits-check.ts"

[tasks."test:policy:browser"]
description = "Check the policy in the real panel (needs the panel: cd web && pnpm build)"
run = "REQUIRE_BROWSER=1 node --experimental-strip-types test/provider-policy-e2e-check.ts"

[tasks."test:cleanup"]
description = "Check the cleanup: the simulated client name, the key interface, the catalog cache"
run = "node --experimental-strip-types test/cleanup-check.ts"

[tasks."test:cleanup:admin"]
description = "Check the cleanup on the panel side: the upstream switch, the credential ids, the retention setting"
run = "node --experimental-strip-types test/cleanup-admin-check.ts"

[tasks."test:quota"]
description = "Check the quota readout: the MiniMax plan by session, the SenseNova pools, the ZCode quota"
run = "node --experimental-strip-types test/quota-readout-check.ts"

[tasks."test:dead-session"]
description = "Check that a refused session is not asked about again"
run = "node --experimental-strip-types test/dead-session-check.ts"

[tasks."test:periodic:off"]
description = "Check that the timer can be turned off (no refresh, no check-in)"
run = "node --experimental-strip-types test/periodic-off-check.ts"

[tasks."test:periodic"]
description = "Check the periodic work: the sessions are refreshed and the balances scanned on a timer"
run = "node --experimental-strip-types test/periodic-check.ts"

[tasks."test:balance-account"]
description = "Check the balance account: the scan, the order, the pinned one"
run = "node --experimental-strip-types test/balance-account-check.ts"

[tasks."test:timer-refresh"]
description = "Check that only the timer refreshes a token, and only when it is due"
run = "node --experimental-strip-types test/timer-refresh-check.ts"

[tasks."test:account-weight"]
description = "Check the account weight and that deleting an account leaves nothing behind"
run = "node --experimental-strip-types test/account-weight-check.ts"

[tasks."test:token-plan"]
description = "Check that the video window is ignored (the gateway serves text only)"
run = "node --experimental-strip-types test/token-plan-check.ts"

[tasks."test:model-visibility"]
description = "Check that a spent account hides no model (503 with Retry-After, not 400)"
run = "node --experimental-strip-types test/model-visibility-check.ts"

[tasks."test:deliver:frames"]
description = "Check the frames the client reads (a message_start without a message gets one)"
run = "node --experimental-strip-types test/deliver-frames-check.ts"

[tasks."test:peek:stream"]
description = "Check the first frame of an upstream answer (a locked stream is read once, and the error frame is parsed)"
run = "node --experimental-strip-types test/peek-stream-check.ts"

[tasks."test:dialect:stream"]
description = "Check that a `data: null` frame from an upstream does not break the answer (it used to throw while reading .usage)"
run = "node --experimental-strip-types test/dialect-stream-check.ts"

[tasks."test:cooldown"]
description = "Check the cooldown: a failed account is set aside, and how long (a fake upstream, no tokens spent)"
run = "node --experimental-strip-types test/cooldown-check.ts"

[tasks."test:health:cooldown"]
description = "Check that /health says which account is cooling down, and until when"
run = "node --experimental-strip-types test/health-cooldown-check.ts"

[tasks."test:aggregate:error"]
description = "Check which failure the root route shows the client (a fake upstream, no tokens spent)"
run = "node --experimental-strip-types test/aggregate-error-check.ts"

[tasks."test:aggregate:usage"]
description = "Check that a request that never reached the upstream still leaves a usage row (a fake upstream, no tokens spent)"
run = "node --experimental-strip-types test/aggregate-usage-check.ts"

[tasks."test:minimax:credits:view"]
description = "Check that the panel's credit list leaves the expired lots out (the same rule the routing uses)"
run = "node --experimental-strip-types test/minimax-credits-view-check.ts"

[tasks."test:admin:contract"]
description = "Check the panel's API against the contract, field by field"
run = "node --experimental-strip-types test/admin-contract-check.ts"

[tasks."test:admin:regression"]
description = "Check that the proxy's own endpoints still behave"
run = "node --experimental-strip-types test/admin-regression-check.ts"

[tasks."test:aggregate"]
description = "Run the tests for the published models"
run = "bash test/aggregate.sh"

[tasks."test:admin"]
description = "Run the tests for the panel's API (Connect)"
run = "node --experimental-strip-types test/admin-check.ts"
depends = ["test:admin:policy"]

[tasks."test:admin:policy"]
description = "Check the upstream provider policy (read, write, validation, the check-in accounts)"
run = "node --experimental-strip-types test/provider-policy-check.ts"

[tasks."test:sensenova:intern"]
description = "Check SenseNova and 书生·端砚 offline: their catalogues, keys and quotas, against a fake upstream"
run = "node --experimental-strip-types test/sensenova-intern-ai-check.ts"

[tasks."test:admin:login"]
description = "Run the tests for the panel's login flows (a fake upstream, no real login)"
run = "node --experimental-strip-types test/admin-login-check.ts"

[tasks."test:login:record"]
description = "Check that a password login closes its login record (the panel must not stay on 'logging in')"
run = "node --experimental-strip-types test/login-record-check.ts"

[tasks."test:effort"]
description = "Check that the thinking level survives the dialect conversion"
run = "node --experimental-strip-types test/effort-check.ts"

[tasks."test:catalog-parity"]
description = "Check that the panel's published models and the root route publish the same numbers"
run = "node --experimental-strip-types test/catalog-parity-check.ts"

[tasks."test:config"]
description = "Check that the settings the panel can change take effect at once (no restart)"
run = "node --experimental-strip-types test/config-restart-check.ts"

[tasks."test:admin:state"]
description = "Check the upstream states, the credential enum and the unpublished reasons"
run = "node --experimental-strip-types test/admin-state-check.ts"

[tasks."test:intern-ai"]
description = "Run the tests for the intern-ai module (no network)"
run = "node --experimental-strip-types test/intern-ai-check.ts"

[tasks."test:intern-ai:quota"]
description = "Check what the panel sees for intern-ai (the windows, the balance, the recovery)"
run = "node --experimental-strip-types test/intern-ai-quota-view-check.ts"

[tasks."test:route"]
description = "Check the root route end to end (a fake upstream, no tokens spent)"
run = "node --experimental-strip-types test/route-e2e-check.ts"

[tasks."test:qoder:benefits"]
description = "Check which Qoder campaigns are worth claiming"
run = "node --experimental-strip-types test/qoder-benefits-check.ts"

[tasks."test:workbuddy:catalog"]
description = "Check the WorkBuddy catalogue in the database: it survives a restart, and a stale one still counts"
run = "node --experimental-strip-types test/workbuddy-catalog-check.ts"

[tasks."test:catalog:persist"]
description = "Check the model catalogue that lives in the database: it survives a restart, and a stale one still counts"
run = "node --experimental-strip-types test/catalog-persist-check.ts"

[tasks."test:refresh-flow"]
description = "Check the shared refresh flow: not due, refused, failed, no session"
run = "node --experimental-strip-types test/refresh-flow-check.ts"

[tasks."test:workbuddy:benefits"]
description = "Check the Buddy's trip: the gift is picked up, the Buddy is not sent away with it"
run = "node --experimental-strip-types test/workbuddy-benefits-check.ts"

[tasks."test:session"]
description = "Check that a request's session and parent session are recognised"
run = "node --experimental-strip-types test/session-check.ts"

[tasks."test:usage"]
description = "Run the tests for the request-level usage log (no network)"
run = "node --experimental-strip-types test/usage-check.ts"

[tasks."test:zcode"]
description = "Run the tests for the ZCode login window (no network)"
run = "node --experimental-strip-types test/zcode-check.ts"

[tasks."test:zcode:headers"]
description = "Check the ZCode request headers against the official client's (no network)"
run = "node --experimental-strip-types test/zcode-headers-check.ts"

[tasks."test:zcode:session"]
description = "Check the ZCode session: an unknown expiry is not an expired session (no network)"
run = "node --experimental-strip-types test/zcode-session-check.ts"

[tasks."test:session-map"]
description = "Check the client's session id mapping to the upstream's (no network)"
run = "node --experimental-strip-types test/session-map-check.ts"

[tasks."test:snapshot"]
description = "Run the tests for reading the health snapshot by provider id (no network)"
run = "node --experimental-strip-types test/snapshot-entry-check.ts"

[tasks."test:tokenrhythm"]
description = "Run the tests for the TokenRhythm tenant choice (no network)"
run = "node --experimental-strip-types test/tokenrhythm-check.ts"

[tasks."test:tokenrhythm:fallback"]
description = "Run the tests for switching tenants when the balance is gone (no network)"
run = "node --experimental-strip-types test/tokenrhythm-fallback-check.ts"

[tasks."test:agent"]
description = "Run the tests for telling the agents apart by their headers"
run = "node --experimental-strip-types test/agent-check.ts"

[tasks."test:minimax:checkin"]
description = "Run the tests for the MiniMax Code daily sign-in"
run = "node --experimental-strip-types test/minimax-checkin-check.ts"

[tasks.proto]
description = "Regenerate the TypeScript client from the contract"
run = "buf generate"

[tasks."proto:lint"]
description = "Check the contract"
run = "buf lint"

[tasks."proto:breaking"]
description = "Fail if the contract changed in a way that breaks the clients"
run = """
# 基线是远端的那一份：契约的改动要先推上去，别人拉下来才知道有没有坏。
log=$(mktemp)
if buf breaking --against '.git#branch=buddy/main' 2>"$log"; then
  echo "契约没有破坏性改动。"
elif grep -q 'no .proto files' "$log"; then
  echo "远端还没有契约，没有基线可比。先把契约推上去。"
else
  cat "$log"
  rm -f "$log"
  exit 1
fi
rm -f "$log"
"""

# ── 面板前端 ──────────────────────────────────────────────────────────────

[tasks."web:install"]
description = "Install the panel's dependencies"
run = "cd web && pnpm install"

[tasks."web:dev"]
description = "Run the panel in development mode"
run = "cd web && pnpm dev"

[tasks."web:build"]
description = "Build the panel into web/dist"
run = "cd web && pnpm build"

[tasks."web:typecheck"]
description = "Type-check the panel"
run = "cd web && pnpm typecheck"

[tasks."web:test"]
description = "Run the panel's tests"
run = "cd web && pnpm test"

# ── 构建 ──────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build the panel and the image"
depends = ["web.build", "image.build"]

[tasks."image:build"]
description = "Build the image that carries the router and the panel"
run = "podman build --format docker -t localhost/buddy-proxy:latest ."
