name: buddy-proxy

# The NAS holds no source: the image is built locally, exported with
# `podman save --format docker-archive` and loaded here with `docker load`.
# This file is the only thing that lives on the NAS beside ./data.
#
# One service, one image: the router serves every upstream and answers in both
# dialects.
services:
  router:
    image: buddy-proxy:latest
    container_name: buddy-router
    command: ["node", "router-proxy.ts"]
    ports:
      - "6450:6450"
    environment:
      # Which upstreams this router serves. Each switch turns on one reverse proxy;
      # the ones that are off are not looked at — no credential, no models, and a
      # request for one is refused.
      MINIMAX_CODE: "true"
      QODER_GLOBAL: "true"
      QODER_CN: "true"
      WORKBUDDY_CN: "true"
      TOKENRHYTHM: "true"
      # Anthropic and OpenAI dialects, routed per model name.
      ROUTER_PORT: "6450"
      # The MiniMax session lives with the others.
      MINIMAX_DATA_DIR: /data
      QODER_DATA_DIR: /data
      # The WorkBuddy session lives next to the Qoder one.
      WORKBUDDY_DATA_DIR: /data
      # The TokenRhythm sessions live in the same place.
      TOKENRHYTHM_DATA_DIR: /data
      # The image healthcheck reads the port from here.
      HEALTH_PORT: "6450"
      # The daily check-in of the China accounts. It runs on its own, so this is
      # only how often it looks; the day rolls over at midnight in China.
      BENEFITS_INTERVAL_MS: "21600000"
      TZ: Asia/Shanghai
      KEYS_FILE: /data/api-keys.json
    # The TokenRhythm accounts and their keys, and the MiniMax plan key, come
    # from the .env file next to this one. The proxy reads the ones it knows
    # by name; nothing else in the file is loaded.
    env_file:
      - .env
    volumes:
      # The OAuth sessions are credentials, not configuration. This directory must
      # survive rebuilds — the refresh tokens rotate on every refresh, so a lost
      # file means re-login.
      - ./data:/data
    restart: unless-stopped
