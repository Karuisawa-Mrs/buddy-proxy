name: buddy-proxy

# The NAS holds no source: the image is built locally, exported with
# `podman save --format docker-archive` and loaded here with `docker load`.
# This file is the only thing that lives on the NAS beside ./data.
#
# One service, one image: the router serves every upstream and answers in both
# dialects.
services:
  router:
    image: buddy-proxy:latest
    container_name: buddy-router
    command: ["node", "router-proxy.ts"]
    ports:
      - "6450:6450"
    environment:
      # Which upstreams this router serves is NOT decided here. The switch of an
      # upstream is the `enabled` column of the provider table: the panel's
      # upstream page changes it, and a fresh install starts with every
      # built-in upstream off.
      # Anthropic and OpenAI dialects, routed per model name.
      ROUTER_PORT: "6450"
      # Everything the service keeps lives in this one directory: the database
      # with the credentials and the settings, the credential log, the salt the
      # device fingerprint is derived from. It has to survive a rebuild.
      BUDDY_DATA_DIR: /data
      TZ: Asia/Shanghai
      KEYS_FILE: /data/api-keys.json
      # The check-in of the China accounts runs on its own timer (see
      # lib/admin/benefits.ts). It is not pinned here: the code decides how
      # often, because the Buddy's trip lasts one to four hours and its gift
      # has to be picked up inside that window.
      #
      # PERIODIC_ENABLED=false turns that timer off entirely: no token
      # refresh, no check-in, no balance scan. Uncomment it to freeze the
      # sessions (a refresh rotates a one-shot token, and two refreshes of
      # the same session make the platform revoke it).
    # The TokenRhythm accounts and their keys, and the MiniMax plan key, come
    # from the .env file next to this one. The proxy reads the ones it knows
    # by name; nothing else in the file is loaded.
    env_file:
      - .env
    volumes:
      # The OAuth sessions are credentials, not configuration. This directory must
      # survive rebuilds — the refresh tokens rotate on every refresh, so a lost
      # file means re-login.
      - ./data:/data
    restart: unless-stopped
